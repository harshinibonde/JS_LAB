<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <div class="side">
        <div class="side-content">
            <span class="brand">Register</span>
            <h1>Create your account</h1>
            <p>Fill in your details below to get started. Fields marked with an asterisk are required.</p>
        </div>
    </div>

    <div class="form-side">
        <form id="regForm" novalidate>

            <h2>Personal Details</h2>

            <div class="grid-3">
                <div class="field">
                    <label for="firstName">First Name <span class="req">*</span></label>
                    <input type="text" id="firstName" placeholder="Jane">
                    <span class="error" id="firstNameError"></span>
                </div>

                <div class="field">
                    <label for="lastName">Last Name <span class="req">*</span></label>
                    <input type="text" id="lastName" placeholder="Doe">
                    <span class="error" id="lastNameError"></span>
                </div>

                <div class="field">
                    <label for="birthday">Birthday <span class="req">*</span></label>
                    <input type="date" id="birthday">
                    <span class="error" id="birthdayError"></span>
                </div>
            </div>

            <h2>Account Details</h2>

            <div class="grid-2">
                <div class="field">
                    <label for="username">Username <span class="req">*</span></label>
                    <input type="text" id="username" placeholder="janedoe23">
                    <span class="error" id="usernameError"></span>
                </div>

                <div class="field">
                    <label for="email">Email <span class="req">*</span></label>
                    <input type="email" id="email" placeholder="jane@example.com">
                    <span class="error" id="emailError"></span>
                </div>
            </div>

            <div class="field">
                <label for="website">Website</label>
                <input type="text" id="website" placeholder="www.example.com">
                <span class="error" id="websiteError"></span>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="password">Password <span class="req">*</span></label>
                    <input type="password" id="password" placeholder="••••••••">
                    <span class="error" id="passwordError"></span>
                </div>

                <div class="field">
                    <label for="rePassword">Re-enter Password <span class="req">*</span></label>
                    <input type="password" id="rePassword" placeholder="••••••••">
                    <span class="error" id="rePasswordError"></span>
                </div>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the <a href="#">terms and conditions</a> <span class="req">*</span></label>
            </div>
            <span class="error" id="termsError"></span>

            <button type="submit">Create Account</button>

            <div class="success" id="successMsg"></div>

        </form>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
