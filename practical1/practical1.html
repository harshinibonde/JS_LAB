<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Department</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(160deg, #eef6ff, #dcecff);
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin: 0 0 12px;
            color: #0f4c81;
            font-size: 56px;
            letter-spacing: 1px;
        }

        h2 {
            margin: 0 0 18px;
            color: #23395b;
            font-size: 38px;
        }

        p {
            margin: 0 0 28px;
            color: #4b5563;
            font-size: 20px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background-color: #0f4c81;
            color: white;
            padding: 12px 22px;
            border-radius: 999px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        a:hover {
            background-color: #0c3d67;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 42px;
            }

            h2 {
                font-size: 28px;
            }

            p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body onload="showExternalAlert()">
    <div class="container">
        <h1>SIT Nagpur</h1>
        <h2>Computer Science Department</h2>
        <p>Welcome to the department page.</p>
        <a href="student-info.html">Student Info Page</a>
    </div>

    <script src="practical1.js"></script>
</body>
</html>
