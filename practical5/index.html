<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Array Min / Max</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="panel">

    <h1>Min / Max Finder</h1>

    <p>Seed values:</p>
    <input type="number" id="v1" value="45">
    <input type="number" id="v2" value="34">
    <input type="number" id="v3" value="99">
    <input type="number" id="v4" value="12">
    <input type="number" id="v5" value="50">
    <p><button onclick="buildArray();">Build Array</button></p>

    <p>Array:</p>
    <div id="cells"></div>

    <p>
        <input type="number" id="newVal" placeholder="value">
        <button onclick="arr.push(Number(document.getElementById('newVal').value)); console.log('After push:', arr); render();">push()</button>
    </p>

    <p>
        <button onclick="arr.pop(); console.log('After pop:', arr); render();">pop()</button>
        <button onclick="arr.splice(0, 1); console.log('After removing element using index:', arr); render();">splice(0,1)</button>
    </p>

    <button onclick="showMinMax();">Find Min &amp; Max</button>

    <div class="readout" id="result"></div>

</div>

<script src="script.js"></script>
</body>
</html>
