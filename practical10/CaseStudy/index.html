<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Orders</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h2{
            color: #333;
        }

        button{
            padding: 10px 20px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover{
            background-color: #555;
        }

        table{
            border-collapse: collapse;
            width: 90%;
            margin-top: 20px;
            background-color: white;
        }

        th,td{
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th{
            background-color: #333;
            color: white;
        }

        tr:hover{
            background-color: #f1f1f1;
        }

        #message{
            margin-top: 20px;
            color: red;
            font-weight: bold;
        }

        #summary{
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>Restaurant Orders</h2>

<button id="loadBtn">View Orders</button>

<table id="orderTable">
    <thead>
        <tr>
            <th>Order ID</th>
            <th>Customer Name</th>
            <th>Food Item</th>
            <th>Quantity</th>
            <th>Total Amount</th>
            <th>Order Status</th>
        </tr>
    </thead>

    <tbody id="tableBody">
    </tbody>
</table>

<div id="summary"></div>
<div id="message"></div>

<script>
$("#loadBtn").click(function(){
    $("#tableBody").empty();
    $("#summary").empty();
    $("#message").empty();

    $.getJSON("orders.json", function(data){
        let totalSales = 0;

        $.each(data, function(index, order){
            $("#tableBody").append(`
                <tr>
                    <td>${order.orderId}</td>
                    <td>${order.customerName}</td>
                    <td>${order.foodItem}</td>
                    <td>${order.quantity}</td>
                    <td>₹${order.totalAmount}</td>
                    <td>${order.status}</td>
                </tr>
            `);

            totalSales += order.totalAmount;
        });

        $("#summary").html(`
            Total Orders: ${data.length}<br>
            Total Sales: ₹${totalSales}
        `);
    }).fail(function(){
        $("#message").text("Error loading orders.json.");
    });
});
</script>

</body>
</html>
